steps:
  install:
    image: node:24-slim
    commands:
      - npm config set ignore-scripts true
      - npm i -g corepack@0.36
      - corepack enable
      - pnpm i --frozen-lockfile
  check-dev-packages:
    image: node:24-slim
    commands:
      - npm config set ignore-scripts true
      - npm i -g corepack@0.36
      - corepack enable
      - apt-get update
      - apt-get install -y --no-install-recommends jq
      - "pnpm list --json | jq -e '[ .. | .version? ] | map(select(. != null)) | map(test(\"dev\")) | any | not'"
  lint-js:
    image: node:24-slim
    group: lint
    commands:
      - npm config set ignore-scripts true
      - npm i -g corepack@0.36
      - corepack enable
      - pnpm lint:js
  lint-hbs:
    image: node:24-slim
    group: lint
    commands:
      - npm config set ignore-scripts true
      - npm i -g corepack@0.36
      - corepack enable
      - pnpm lint:hbs
  lint-prettier:
    image: node:24-slim
    group: lint
    commands:
      - npm config set ignore-scripts true
      - npm i -g corepack@0.36
      - corepack enable
      - pnpm lint:prettier
  test:
    image:  node:24-slim
    commands:
      - npm config set ignore-scripts true
      - npm i -g corepack@0.36
      - corepack enable
      - pnpm test:ember
  precompile:
    image: node:24-slim
    commands:
      - npm config set ignore-scripts true
      - npm i -g corepack@0.36
      - corepack enable
      - pnpm prepack
when:
  - evaluate: 'CI_PIPELINE_EVENT == "pull_request" && not (CI_COMMIT_PULL_REQUEST_LABELS contains "dependabot")'
